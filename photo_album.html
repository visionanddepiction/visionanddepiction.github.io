<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision and Depiction 2026 – Photography</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #ffffff;
    --text:      #1a1a1a;
    --muted:     #555555;
    --blue:      #0645ad;
    --blue-dark: #0b3d91;
    --border:    #d0d0d0;
    --hover-bg:  #f4f7fc;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; color: var(--blue-dark); }

  /* ── Header ── */
  header {
    padding: 40px 48px 28px;
    border-bottom: 1px solid var(--border);
    max-width: 1600px;
    margin: 0 auto;
  }

  .site-title {
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  h1 {
    font-size: clamp(24px, 3.5vw, 42px);
    font-weight: 700;
    color: var(--text);
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin-bottom: 10px;
  }

  .header-sub {
    font-size: 14px;
    color: var(--muted);
    margin-top: 6px;
  }

  .header-sub a {
    color: var(--blue);
    font-weight: 500;
  }

  .header-credit {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  .header-credit a { color: var(--blue); }

  /* ── Gallery ── */
  .gallery-wrap {
    padding: 32px 48px 80px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 8px;
  }

  .thumb {
    display: block;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    aspect-ratio: 3/2;
    background: #e8e8e8;
    border: 1px solid var(--border);
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.45s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.3s;
    opacity: 0.97;
  }

  .thumb:hover img {
    transform: scale(1.03);
    opacity: 1;
  }

  .thumb-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(6,69,173,0.55) 0%, transparent 55%);
    opacity: 0;
    transition: opacity 0.3s;
    display: flex;
    align-items: flex-end;
    padding: 12px 14px;
  }

  .thumb:hover .thumb-overlay { opacity: 1; }

  .thumb-num {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.85);
    font-weight: 500;
  }

  /* ── Lightbox ── */
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
  }

  #lightbox.open { display: flex; }

  #lb-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(10,10,10,0.96);
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Side arrows */
  .lb-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.75);
    width: 56px;
    height: 110px;
    border-radius: 2px;
    font-size: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
    user-select: none;
  }

  .lb-arrow:hover {
    background: rgba(6,69,173,0.35);
    border-color: #5b8de4;
    color: #fff;
  }

  #lb-prev { left: 20px; }
  #lb-next { right: 20px; }

  /* Center block */
  #lb-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: calc(100vw - 160px);
    padding: 52px 0 16px;
    animation: scaleIn 0.25s cubic-bezier(0.34,1.4,0.64,1);
  }

  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
  }

  #lb-img {
    max-width: 100%;
    max-height: calc(100vh - 120px);
    object-fit: contain;
    display: block;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    transition: opacity 0.2s;
  }

  #lb-footer {
    margin-top: 16px;
  }

  #lb-counter {
    font-size: 12px;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    text-align: center;
  }

  #lb-close {
    position: absolute;
    top: 14px;
    right: 0;
    background: none;
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.6);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 7px 16px;
    border-radius: 2px;
    font-family: inherit;
    transition: color 0.2s, border-color 0.2s;
  }

  #lb-close:hover { color: #fff; border-color: rgba(255,255,255,0.5); }

  /* ── Footer ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 20px 48px;
    font-size: 12px;
    color: var(--muted);
    max-width: 1600px;
    margin: 0 auto;
  }

  footer a { color: var(--blue); }

  /* ── Responsive ── */
  @media (max-width: 960px) {
    .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  }
  @media (max-width: 640px) {
    header, .gallery-wrap, .topnav, footer { padding-left: 16px; padding-right: 16px; }
    .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 5px; }
    #lb-content { max-width: calc(100vw - 96px); }
    .lb-arrow { width: 38px; height: 68px; font-size: 20px; }
    #lb-prev { left: 6px; }
    #lb-next { right: 6px; }
  }
</style>
</head>

const THB  = 'Website_w2400_th/';
const FULL = 'Website_w2400/';

// Build grid
const gallery = document.getElementById('gallery');
files.forEach((f, i) => {
  const a = document.createElement('a');
  a.className = 'thumb';
  a.innerHTML = `
    <img src="${THB}${f}" alt="Photo ${i+1}" loading="lazy">
    <div class="thumb-overlay"><span class="thumb-num">${String(i+1).padStart(3,'0')}</span></div>
  `;
  a.addEventListener('click', e => { e.preventDefault(); openLightbox(i); });
  gallery.appendChild(a);
});

// Lightbox
let current = 0;
const lb      = document.getElementById('lightbox');
const lbImg   = document.getElementById('lb-img');
const lbCount = document.getElementById('lb-counter');

function openLightbox(idx) {
  current = idx;
  showImage();
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lb.classList.remove('open');
  document.body.style.overflow = '';
}

function showImage() {
  lbImg.style.opacity = 0;
  lbImg.src = FULL + files[current];
  lbImg.onload = () => { lbImg.style.opacity = 1; };
  lbCount.textContent = `${String(current+1).padStart(3,'0')} / ${String(files.length).padStart(3,'0')}`;
}

function prev() { current = (current - 1 + files.length) % files.length; showImage(); }
function next() { current = (current + 1) % files.length; showImage(); }

document.getElementById('lb-prev').addEventListener('click', prev);
document.getElementById('lb-next').addEventListener('click', next);
document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-backdrop').addEventListener('click', closeLightbox);

document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape')     closeLightbox();
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft')  prev();
});

let touchX = null;
lb.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
lb.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) { dx < 0 ? next() : prev(); }
  touchX = null;
});
</script>
